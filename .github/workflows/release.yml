name: Release I2C Integration to Docker Hub

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version action
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, custom]
      custom_version:
        description: Explicit stable version when release_type is custom
        required: false
        type: string
      push_latest:
        description: Also publish latest
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: i2c-release-${{ github.event.repository.full_name }}
  cancel-in-progress: false

env:
  RELEASE_IMAGE: piphinetwork/i2c-integration
  DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require default branch
        run: |
          [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]] || { echo "Releases must run from the default branch" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m compileall -q src tests scripts
          python -m json.tool src/manifest.json >/dev/null
          pytest
          python scripts/release.py --bump patch --docker-image "${RELEASE_IMAGE}" --dry-run
      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ inputs.release_type }}" == "custom" ]]; then
            [[ -n "${{ inputs.custom_version }}" ]] || { echo "custom_version is required" >&2; exit 1; }
            VERSION=$(python scripts/release.py --set-version "${{ inputs.custom_version }}" --docker-image "${RELEASE_IMAGE}")
          else
            VERSION=$(python scripts/release.py --bump "${{ inputs.release_type }}" --docker-image "${RELEASE_IMAGE}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate release policy
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || { echo "$TAG already exists" >&2; exit 1; }
          [[ -n "${DOCKERHUB_OIDC_CONNECTIONID}" ]] || { echo "Docker Hub OIDC connection ID is missing" >&2; exit 1; }
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/manifest.json
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
      - name: Exchange Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection_id: ${{ env.DOCKERHUB_OIDC_CONNECTIONID }}

      - uses: docker/login-action@v4.5.0
        with:
          username: piphinetwork
          password: ${{ steps.docker_oidc.outputs.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RELEASE_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish release revision
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "v${{ steps.version.outputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          name: v${{ steps.version.outputs.version }}
