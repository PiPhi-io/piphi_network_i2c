name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m compileall -q src tests scripts
          python -m json.tool src/manifest.json >/dev/null
          pytest
          python scripts/release.py --bump patch --docker-image piphinetwork/i2c-integration --dry-run
      - name: Build hardware container
        run: docker build --tag piphi-network-i2c:ci .
