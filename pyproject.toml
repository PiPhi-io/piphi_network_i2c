[project]
name = "piphi-network-i2c"
version = "0.1.0"
description = "PiPhi integration runtime for local I2C environmental sensors."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "piphi-runtime-kit-python==0.6.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
hardware = [
  "smbus2>=0.5.0",
  "bme680 @ git+https://github.com/pimoroni/bme680-python.git",
  "bme280 @ git+https://github.com/pimoroni/bme280-python.git",
  "adafruit-circuitpython-ahtx0>=1.0.0",
  "adafruit-circuitpython-pm25",
  "adafruit-blinka>=8.0.0",
  "EasyMCP2221",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
piphi_network_i2c = "piphi_network_i2c.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_i2c"]
